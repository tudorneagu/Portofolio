name: Portfolio

# Une pull request vérifie le code. Seul un push sur main construit l'image et déploie.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # Image et ship sont deux jobs : un timeout SSH ne doit pas relancer le build.
  image:
    name: Build and push image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.repo.outputs.repo }}
    steps:
      - uses: actions/checkout@v7

      # Les noms d'image doivent être en minuscules ; le dépôt s'appelle « Portofolio ».
      - name: Lowercase repository name
        id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}:latest
            ghcr.io/${{ steps.repo.outputs.repo }}:${{ github.sha }}

  ship:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Encode compose file
        run: echo "COMPOSE_B64=$(base64 -w0 docker-compose.yml)" >> "$GITHUB_ENV"

      - name: Write .env on VPS and deploy
        uses: appleboy/ssh-action@v1
        env:
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
          GHCR_REPO: ${{ needs.image.outputs.repo }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          timeout: 2m
          command_timeout: 10m
          envs: COMPOSE_B64,GHCR_REPO,ANTHROPIC_API_KEY,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            APP_DIR=/app/portofolio
            mkdir -p "$APP_DIR"
            echo "$COMPOSE_B64" | base64 -d > "$APP_DIR/docker-compose.yml"

            # Créé en 600 avant toute écriture : il contient la clé de l'assistant.
            ENV_FILE="$APP_DIR/.env"
            install -m 600 /dev/null "$ENV_FILE"
            echo "GHCR_REPO=${GHCR_REPO}"                 >> "$ENV_FILE"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" >> "$ENV_FILE"

            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            cd "$APP_DIR"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
